name: AMD395 Windows Build

on:
  pull_request:
    branches:
      - amd395-win
  push:
    branches:
      - amd395-win
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amd395-windows-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Unit tests
        run: go test ./...

      - name: Packaging and workflow contract tests
        run: make amd395-build-test

      - name: Build Windows package
        id: package
        env:
          OUTPUT_DIR: ${{ github.workspace }}/dist/amd395-windows
        run: |
          bash ./scripts/package-amd395-windows.sh
          short_sha="${GIT_COMMIT:0:12}"
          echo "short_sha=$short_sha" >> "$GITHUB_OUTPUT"

      - name: Verify package metadata and checksum
        working-directory: dist/amd395-windows
        run: |
          sha256sum -c checksums.txt
          python3 - "$GIT_COMMIT" <<'PY'
          import json
          import pathlib
          import sys

          with open("build-metadata.json", encoding="utf-8") as fh:
              metadata = json.load(fh)

          assert metadata["git_commit"] == sys.argv[1]
          assert metadata["target_os"] == "windows"
          assert metadata["target_arch"] == "amd64"
          assert pathlib.Path(metadata["filename"]).is_file()
          PY

      - name: Upload Windows package
        uses: actions/upload-artifact@v7
        with:
          name: aima-amd395-windows-${{ steps.package.outputs.short_sha }}
          path: |
            dist/amd395-windows/*.exe
            dist/amd395-windows/checksums.txt
            dist/amd395-windows/build-metadata.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
