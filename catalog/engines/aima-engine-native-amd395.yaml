kind: engine_asset
metadata:
  name: aima-engine-native-amd395
  type: aima-engine-native
  version: "1.5.1"
  supported_formats: [safetensors]
  supported_model_types: [llm, vlm]
hardware:
  gpu_arch: RDNA3.5
  vram_min_mib: 0
startup:
  command:
    - aima-engine
    - serve
    - --model-dir
    - "{{.ModelPath}}"
    - --host
    - 127.0.0.1
  ports:
    - name: http
      flag: --port
      config_key: port
      primary: true
  default_args:
    port: 8000
    context_tokens: 8192
    cache_capacity: 9216
  internal_args: [port]
  health_check:
    path: /health
    timeout_s: 120
  warmup:
    enabled: false
api:
  protocol: openai
  base_path: /v1
  upstream_model: aima-amd395-qwen36-35b
amplifier:
  features:
    - native_rocm
    - safetensors
    - prefix_cache
    - variable_length_prefill
    - composed_aot_prefill
    - function_calling
    - multimodal
    - reasoning
    - temperature_sampling
    - tool_calling
  performance_gain: "Portable native gfx1151 text, image, video, reasoning, and tool serving with bundled ROCm userspace and variable-length AOT prefill for Qwen3.6 BF16"
partition_hints:
  min_gpu_memory_mib: 0
  recommended_gpu_cores_percent: 100
time_constraints:
  cold_start_s: [20, 60]
  model_switch_s: [20, 60]
runtime:
  default: native
  platform_recommendations:
    linux/amd64: native
source:
  binary: aima-engine
  platforms: [linux/amd64]
  url_template: "https://github.com/skyguan92/AIMA-AMD395-Qwen36-35B-Linux-Engine/releases/download/v1.5.1-native-vl.5/{platform_file}"
  platform_files:
    linux/amd64: "aima-engine-native-portable-194f2a673904.tar.zst"
  sha256:
    linux/amd64: "59f30c4232b8459f3efcd7b8506cc71b957614c0aac1fa96a2eb4e15f52940a3"
  mirror_templates:
    - "https://ghfast.top/{url}"
    - "https://cf.ghproxy.cc/{url}"
    - "https://gh-proxy.com/{url}"
  probe:
    version_command: ["./aima-engine", "--version"]
    version_pattern: "aima-engine-native[[:space:]]+v?([0-9]+\\.[0-9]+\\.[0-9]+)-native"
    fallback_version: "unknown"
