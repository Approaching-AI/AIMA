kind: engine_asset
metadata:
  name: aima-engine-native-amd395
  type: aima-engine-native
  version: "1.5.0"
  supported_formats: [safetensors]
  supported_model_types: [llm]
hardware:
  gpu_arch: RDNA3.5
  vram_min_mib: 0
startup:
  command:
    - aima-engine
    - serve
    - --model-dir
    - "{{.ModelPath}}"
    - --host
    - 127.0.0.1
  ports:
    - name: http
      flag: --port
      config_key: port
      primary: true
  default_args:
    port: 8000
    context_tokens: 8192
  internal_args: [port]
  health_check:
    path: /health
    timeout_s: 120
  warmup:
    enabled: true
    prompt: "Hello"
    max_tokens: 1
    timeout_s: 120
api:
  protocol: openai
  base_path: /v1
  upstream_model: aima-amd395-qwen36-35b
amplifier:
  features:
    - native_rocm
    - safetensors
    - prefix_cache
    - function_calling
  performance_gain: "Native gfx1151 engine with bundled ROCm userspace for Qwen3.6 BF16 inference"
partition_hints:
  min_gpu_memory_mib: 0
  recommended_gpu_cores_percent: 100
time_constraints:
  cold_start_s: [20, 60]
  model_switch_s: [20, 60]
runtime:
  default: native
  platform_recommendations:
    linux/amd64: native
source:
  binary: aima-engine
  platforms: [linux/amd64]
  install_type: preinstalled
  probe:
    paths:
      - /opt/aima-engine/bin/aima-engine
      - /usr/local/bin/aima-engine
    version_command: ["./aima-engine", "--version"]
    version_pattern: "aima-engine-native[[:space:]]+v?([0-9]+\\.[0-9]+\\.[0-9]+)-native"
    fallback_version: "unknown"
